<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIP Trading Simulator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@300;400;600;900&display=swap');

        :root {
            --bg-base: #050505; --bg-panel: #0d0606;
            --maroon-main: #731313; --maroon-dark: #400707; --maroon-light: #991f1f;
            --gold-accent: #d4af37; --text-main: #f0e6e6; --text-muted: #8c7373;
            --buy-color: #1e824c; --sell-color: #991f1f;
        }
        
        body { 
            margin: 0; padding: 0; background-color: #000; color: var(--text-main); 
            font-family: 'Poppins', sans-serif;
            height: 100%; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; 
        }

        html {
            height: 100%;
        }

        #app-container {
            width: 100%; height: 100%; 
            background-color: var(--bg-base);
            position: relative; overflow: hidden; display: flex; flex-direction: column;
        }

        /* --- OVERLAYS --- */
        .overlay-screen {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1000; flex-direction: column; justify-content: center; align-items: center; 
            text-align: center; padding: 20px; box-sizing: border-box;
        }
        #security-blur { background: rgba(0, 0, 0, 0.98); backdrop-filter: blur(15px); }
        
        #loser-screen { background: rgba(15, 0, 0, 0.98); }
        .loser-text {
            color: #ff0000; font-size: 2.8rem; font-weight: 900; line-height: 1.1;
            text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000, 0 0 60px #800000;
            animation: pulse-red 1s infinite alternate; font-family: 'Poppins', sans-serif;
        }

        /* ANIMASI TRADER PROFESIONAL (3x TP & > $50) */
        #pro-screen { background: rgba(10, 15, 0, 0.98); z-index: 2000; }
        .pro-text {
            color: #d4af37; font-size: 2.8rem; font-weight: 900; line-height: 1.1;
            text-shadow: 0 0 20px #d4af37, 0 0 40px #d4af37, 0 0 60px #ffffff;
            animation: pulse-gold 1s infinite alternate; font-family: 'Poppins', sans-serif;
        }
        @keyframes pulse-gold { from { transform: scale(1); text-shadow: 0 0 20px #d4af37; } to { transform: scale(1.05); text-shadow: 0 0 40px #d4af37, 0 0 80px #fff; } }

        #low-balance-screen { background: rgba(20, 10, 0, 0.98); }
        .warning-text {
            color: #ff8c00; font-size: 2rem; font-weight: 900; line-height: 1.2;
            text-shadow: 0 0 20px #ff8c00, 0 0 40px #ff8c00;
            animation: pulse-orange 1s infinite alternate; font-family: 'Poppins', sans-serif;
        }

        /* ANIMASI MARGIN CALL */
        #mc-screen { background: rgba(20, 0, 0, 0.95); z-index: 2000; }
        .mc-text {
            color: #ff0000; font-size: 3.2rem; font-weight: 900; line-height: 1.1;
            text-shadow: 0 0 10px #ff0000, 0 0 30px #ff0000;
            animation: shake 0.3s infinite; font-family: 'Poppins', sans-serif;
        }

        /* ANIMASI FLOATING LOSS > $50 (TAUNTING) */
        .taunt-msg {
            position: absolute; top: -100px; left: 50%; transform: translateX(-50%);
            background: rgba(153, 31, 31, 0.95); color: white; padding: 15px;
            border-radius: 8px; border: 2px solid #ff0000; font-weight: 900; font-size: 0.9rem;
            z-index: 2000; transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            text-align: center; width: 85%; box-shadow: 0 5px 25px rgba(255,0,0,0.5);
            line-height: 1.4;
        }
        .taunt-msg.show { top: 70px; animation: shake 0.4s infinite; }

        @keyframes shake {
            0% { transform: translateX(-50%) translate(2px, 1px) rotate(0deg); }
            20% { transform: translateX(-50%) translate(-3px, 0px) rotate(2deg); }
            40% { transform: translateX(-50%) translate(1px, -2px) rotate(-1deg); }
            60% { transform: translateX(-50%) translate(-2px, 3px) rotate(1deg); }
            80% { transform: translateX(-50%) translate(3px, -1px) rotate(-2deg); }
            100% { transform: translateX(-50%) translate(0px, 0px) rotate(0deg); }
        }
        
        #winner-screen { background: rgba(0, 15, 0, 0.98); }
        .winner-text { color: #d4af37; font-size: 2.2rem; font-weight: 900; line-height: 1.2; text-shadow: 0 0 20px #d4af37, 0 0 40px #d4af37; }
        
        @keyframes pulse-red { from { transform: scale(1); text-shadow: 0 0 20px #ff0000; } to { transform: scale(1.05); text-shadow: 0 0 40px #ff0000, 0 0 80px #ff0000; } }
        @keyframes pulse-orange { from { transform: scale(1); text-shadow: 0 0 20px #ff8c00; } to { transform: scale(1.05); text-shadow: 0 0 40px #ff8c00, 0 0 80px #ff8c00; } }
        
        .btn-dismiss { margin-top: 25px; padding: 12px 25px; background: transparent; border: 2px solid white; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; }

        /* --- KUIS EDUKASI UI --- */
        #quiz-section {
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            height: 100%; padding: 20px; background: radial-gradient(circle at center, var(--bg-panel) 0%, var(--bg-base) 100%);
            overflow-y: auto; z-index: 5; box-sizing: border-box;
        }
        .quiz-card { background: rgba(13, 6, 6, 0.95); padding: 25px; border-radius: 16px; border: 1px solid var(--maroon-dark); width: 100%; box-sizing: border-box; text-align: center; }
        .quiz-card h2 { margin-top: 0; color: var(--gold-accent); font-family: 'Playfair Display', serif; font-size: 1.4rem; border-bottom: 1px solid var(--maroon-dark); padding-bottom: 12px; }
        .quiz-question { font-size: 0.95rem; margin-bottom: 20px; line-height: 1.5; }
        .quiz-btn { display: block; width: 100%; padding: 10px; margin-bottom: 8px; background: transparent; color: var(--text-main); border: 1px solid var(--maroon-main); text-align: left; border-radius: 6px; cursor: pointer; font-size: 0.85rem; box-sizing: border-box;}
        .quiz-btn:active { background: var(--maroon-dark); }
        .quiz-feedback { margin-top: 10px; font-size: 0.85rem; min-height: 35px; text-align: left;}
        .btn-continue, .btn-market { width: 100%; padding: 12px; margin-top: 8px; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; text-transform: uppercase; font-size: 0.9rem;}
        .btn-continue { display: none; background: linear-gradient(135deg, var(--maroon-main), var(--maroon-dark)); border: 1px solid var(--maroon-light); }
        .btn-market { display: none; background: linear-gradient(135deg, var(--buy-color), #145b35); border: 1px solid #2ecc71; }

        /* --- TRADING GAME UI --- */
        #game-section { display: none; flex-direction: column; flex: 1; z-index: 5; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--bg-panel); border-bottom: 1px solid var(--maroon-dark); flex-shrink: 0;}
        .account-info { display: flex; gap: 15px; }
        .info-box { display: flex; flex-direction: column; }
        .info-label { font-size: 0.6rem; color: var(--gold-accent); text-transform: uppercase; font-weight: 600; }
        .info-value { font-size: 1rem; font-weight: 600; font-family: 'Playfair Display', serif; }
        .profit { color: var(--buy-color); }
        .loss { color: var(--sell-color); }
        
        .play-pause-btn { background: var(--maroon-main); border: 1px solid var(--gold-accent); color: white; padding: 5px 8px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.75rem;}
        #btn-speed { background: #1a1a2e; border-color: #4a4e69; width: 35px; }
        #btn-mute { background: #1a1a2e; border-color: #4a4e69; width: 35px; font-size: 0.7rem; }
        #btn-stats { background: #1a1a2e; border-color: #4a4e69; padding: 5px 8px; font-size: 0.65rem; }

        #canvas-container { flex: 1; width: 100%; height: 100%; position: relative; background: #000; cursor: default; overflow: hidden;}
        #canvas-container:active { cursor: default; }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; background: #000;}
        .reset-view-hint { position: absolute; top: 10px; left: 10px; font-size: 0.6rem; color: rgba(255,255,255,0.4); pointer-events: none;}

        /* News Ticker removed */

        .control-panel { background: var(--bg-panel); padding: 10px 12px; border-top: 1px solid var(--maroon-dark); box-sizing: border-box; width: 100%; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px;}
        
        .trade-settings { background: #150a0a; padding: 8px; border-radius: 8px; border: 1px solid var(--maroon-dark); box-sizing: border-box; width: 100%; }
        .trade-settings label { font-size: 0.7rem; display: flex; align-items: center; gap: 6px; }
        .manual-inputs { display: none; flex-direction: column; gap: 5px; margin-top: 8px; width: 100%; }
        .input-group { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 10px; }
        .input-group label { font-size: 0.65rem; color: var(--gold-accent); flex: 1.2; }
        .input-group input { flex: 1; background: var(--bg-base); border: 1px solid var(--maroon-light); color: white; padding: 5px; border-radius: 4px; box-sizing: border-box; font-family: 'Poppins', sans-serif; font-size: 0.8rem;}

        /* Trade Notes */
        #trade-notes { width: 100%; background: var(--bg-base); border: 1px solid var(--maroon-light); color: white; padding: 6px; border-radius: 4px; font-family: 'Poppins', sans-serif; font-size: 0.75rem; resize: none; box-sizing: border-box; }

        .buttons { display: flex; gap: 8px; }
        .btn { flex: 1; border: none; padding: 10px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; color: white; text-transform: uppercase; cursor: pointer;}
        .btn-buy { background: var(--buy-color); }
        .btn-sell { background: var(--sell-color); }
        .btn-close { background: transparent; border: 1px solid var(--gold-accent); color: var(--gold-accent); display: none; }

        /* Timeframe & Indicators */
        .chart-controls { display: flex; gap: 6px; flex-wrap: wrap; }
        .chart-btn { padding: 4px 10px; background: transparent; border: 1px solid var(--maroon-light); color: var(--text-muted); border-radius: 4px; font-size: 0.65rem; cursor: pointer; }
        .chart-btn.active { background: var(--maroon-dark); color: var(--gold-accent); border-color: var(--gold-accent); }

        /* Streak Display */
        #streak-display {
            position: absolute; top: 35px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.85); border: 1px solid var(--gold-accent); color: var(--gold-accent);
            padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 700;
            z-index: 15; display: none; white-space: nowrap;
        }

        /* JURNAL HISTORY */
        .journal-container { 
            background: #110808; border: 1px solid var(--maroon-dark); border-radius: 6px; padding: 6px; 
            max-height: 90px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px;
            touch-action: pan-y; pointer-events: auto;
        }
        .journal-container h4 { margin: 0; font-size: 0.65rem; color: var(--gold-accent); text-align: center; border-bottom: 1px solid #333; padding-bottom: 3px;}
        .journal-item { display: flex; justify-content: space-between; font-size: 0.65rem; border-bottom: 1px solid rgba(255,255,255,0.05); padding: 3px 0; }
        .journal-empty { text-align: center; font-size: 0.65rem; color: #555; font-style: italic; margin-top: 5px;}

        /* Stats Modal */
        #stats-modal {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 3000; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px; box-sizing: border-box;
        }
        .stats-card { background: var(--bg-panel); border: 1px solid var(--maroon-dark); border-radius: 12px; padding: 20px; width: 100%; max-width: 350px; }
        .stats-card h2 { color: var(--gold-accent); margin-top: 0; font-family: 'Playfair Display', serif; }
        .stats-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.8rem; }
        .stats-row:last-child { border-bottom: none; }
        .stats-label { color: var(--text-muted); }
        .stats-value { color: var(--text-main); font-weight: 600; }
        .rank-badge { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; margin-top: 8px; }

        /* Daily Challenge */
        #daily-challenge {
            position: absolute; top: 35px; right: 10px;
            background: rgba(212, 175, 55, 0.15); border: 1px solid var(--gold-accent);
            color: var(--gold-accent); padding: 4px 10px; border-radius: 8px;
            font-size: 0.6rem; font-weight: 600; z-index: 15; max-width: 180px; text-align: center;
        }

        /* Particle Canvas */
        #particle-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1500;
        }

        /* Screenshot overlay for sharing */
        #screenshot-overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 3000; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px; box-sizing: border-box;
        }
        .share-btn { padding: 10px 20px; margin: 5px; border-radius: 8px; border: none; color: white; font-weight: 600; cursor: pointer; }
        .share-wa { background: #25D366; }
        .share-ig { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .share-close { background: transparent; border: 1px solid white; margin-top: 15px; }

        /* Reset options */
        .reset-options { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .reset-btn { padding: 10px 20px; border-radius: 8px; border: 1px solid white; color: white; background: transparent; cursor: pointer; font-weight: 600; }
        .reset-btn-free { border-color: var(--gold-accent); color: var(--gold-accent); }
        .reset-btn-paid { border-color: var(--sell-color); color: var(--sell-color); }
        .reset-cooldown { font-size: 0.75rem; color: var(--text-muted); margin-top: 5px; }
    </style>
</head>
    <body>
        <div id="debug-test" style="position:fixed;top:0;left:0;width:100%;background:red;color:white;padding:10px;z-index:9999;font-size:14px;">DEBUG: Game Loading... <span id="debug-info"></span></div>
        <script>
            const debugInfo = document.getElementById('debug-info');
            const now = new Date();
            debugInfo.innerHTML = '| ' + now.toISOString() + ' | JS:START';
            
            window.onerror = function(msg, url, line) {
                console.error('ERROR:', msg, 'at', url + ':' + line);
                if (debugInfo) {
                    debugInfo.innerHTML = 'ERROR: ' + msg + ' (line ' + line + ')';
                }
                return false;
            };

        <div id="app-container">
            <div style="padding:20px; text-align:center; background:#0f0; min-height:100vh; border: 5px solid #ff0;">
                <h2 style="color:#000; margin-bottom:10px; font-size: 2rem;">TEST CONTENT</h2>
                <p style="color:#000;">Jika kamu melihat ini, CSS dan HTML bekerja normal.</p>
                <button onclick="alert('JS works!')" style="padding:10px 20px; background:#731313; color:#fff; border:1px solid #d4af37; margin-top:10px;">TEST JS</button>
            </div>
        <canvas id="particle-canvas"></canvas>
        
        <div id="taunt-loss" class="taunt-msg">ðŸ“‰ XAUUSD: "HAHAHA MENURUTKU BAKAL MARGIN CALL!!!"</div>
        <div id="streak-display"></div>
        <div id="daily-challenge"></div>

        <div id="security-blur" class="overlay-screen">
            <h3 style="color:var(--sell-color); margin-bottom:10px;">âš ï¸ GAME DIJEDA</h3>
            <p style="color:var(--text-muted); font-size:0.85rem;">Terdeteksi screenshot, split screen, atau kehilangan fokus.<br>Klik untuk melanjutkan.</p>
        </div>

        <div id="mc-screen" class="overlay-screen" style="display:none; position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); width:auto; height:auto; max-width:90%; padding:30px; background:rgba(20,0,0,0.98); border-radius:16px; border:2px solid #ff0000; z-index:2000;">
            <div class="mc-text" style="text-align:center;">MARGIN<br>CALL</div>
            <p style="color: #ddd; margin-top: 15px; font-size: 0.95rem; text-align:center;">Saldo Habis Tersapu Floating Loss!</p>
            <div class="reset-options" style="margin-top:20px;">
                <button class="reset-btn reset-btn-paid" onclick="resetAfterMC(true)">RESET $100 (Biaya $10)</button>
                <button class="reset-btn reset-btn-free" id="btn-free-reset" onclick="resetAfterMC(false)" style="display:none;">RESET GRATIS</button>
                <div class="reset-cooldown" id="reset-cooldown"></div>
            </div>
        </div>

        <div id="low-balance-screen" class="overlay-screen">
            <div class="warning-text">MASIH MAU DIHAJAR?<br>ATAU BELAJAR DULU SEBELUM ENTRY?</div>
            <p style="color: #ccc; margin-top: 15px; font-size: 0.85rem;">Peringatan: Saldo Anda tersisa kurang dari 20% modal awal.</p>
            <button class="btn-dismiss" onclick="document.getElementById('low-balance-screen').style.display='none'">LANJUTKAN</button>
        </div>

        <!-- LAYAR TRADER PROFESIONAL (3x TP, Profit > $50) -->
        <div id="pro-screen" class="overlay-screen">
            <div class="pro-text">TRADER<br>PROFESIONAL</div>
            <p style="color: #ddd; margin-top: 15px; font-size: 0.95rem;">Mendapatkan 3x TP Beruntun dengan Total Profit Lebih Dari $50!</p>
            <button class="btn-dismiss" style="border-color:var(--gold-accent); color:var(--gold-accent);" onclick="document.getElementById('pro-screen').style.display='none'">TERUSKAN TRADING</button>
            <button class="btn-dismiss" style="border-color:#25D366; color:#25D366; margin-top:10px;" onclick="shareResult('pro')">SHARE HASIL</button>
        </div>

        <div id="loser-screen" class="overlay-screen">
            <div class="loser-text">ANDA<br>PECUNDANG</div>
            <p style="color: #aaa; margin-top: 15px; font-size: 0.85rem;">Terkena Stop Loss 3x berturut-turut.</p>
            <button class="btn-dismiss" onclick="document.getElementById('loser-screen').style.display='none'">COBA LAGI</button>
            <button class="btn-dismiss" style="border-color:#aaa; color:#aaa; margin-top:10px;" onclick="shareResult('loser')">SHARE HASIL</button>
        </div>

        <div id="winner-screen" class="overlay-screen">
            <div class="winner-text">TARGET TERCAPAI!</div>
            <p style="color: #ddd; margin-top: 15px; font-size: 0.95rem;">Profit +$30 Tercapai!<br>Anda diizinkan keluar dari game.</p>
            <button class="btn-dismiss" style="border-color:var(--gold-accent); color:var(--gold-accent);" onclick="allowExit()">TUTUP GAME</button>
            <button class="btn-dismiss" style="border-color:#25D366; color:#25D366; margin-top:10px;" onclick="shareResult('winner')">SHARE HASIL</button>
        </div>

        <!-- Stats Modal -->
        <div id="stats-modal">
            <div class="stats-card">
                <h2>ðŸ“Š Statistik Trader</h2>
                <div id="stats-content"></div>
                <button class="btn-dismiss" style="margin-top:15px;" onclick="document.getElementById('stats-modal').style.display='none'">TUTUP</button>
            </div>
        </div>

        <!-- Share Modal -->
        <div id="screenshot-overlay">
            <h2 style="color:var(--gold-accent); margin-bottom:15px;">Bagikan Hasil Trading</h2>
            <button class="share-btn share-wa" onclick="shareTo('whatsapp')">ðŸ“± WhatsApp</button>
            <button class="share-btn share-ig" onclick="shareTo('instagram')">ðŸ“¸ Instagram Story</button>
            <button class="share-btn share-close" onclick="document.getElementById('screenshot-overlay').style.display='none'">BATAL</button>
        </div>

        <div id="quiz-section">
            <div class="quiz-card">
                <h2>Eksklusif Edukasi</h2>
                <div class="quiz-question" id="q-text">Loading kuis...</div>
                <div id="q-options"></div>
                <div class="quiz-feedback" id="q-feedback"></div>
                <button class="btn-continue" id="btn-continue" onclick="nextAction()">Soal Berikutnya</button>
                <button class="btn-market" id="btn-market" onclick="startGame()">Akses Market Trading âž”</button>
            </div>
        </div>

        <div id="game-section">
            <div class="top-bar">
                <div class="account-info">
                    <div class="info-box"><span class="info-label">Balance</span><span class="info-value" id="balance">$100.00</span></div>
                    <div class="info-box"><span class="info-label">Floating</span><span class="info-value" id="pnl">$0.00</span></div>
                </div>
                <div style="display:flex; gap: 6px;">
                    <button class="play-pause-btn" id="btn-speed" onclick="toggleSpeed()">1x</button>
                    <button class="play-pause-btn" id="btn-mute" onclick="toggleMute()">ðŸ”Š</button>
                    <button class="play-pause-btn" id="btn-stats" onclick="showStats()">ðŸ“Š</button>
                    <button class="play-pause-btn" id="btn-play-pause" onclick="togglePlayPause()">â¸ PAUSE</button>
                </div>
            </div>
            
            <div id="canvas-container" ondblclick="resetView()">
                <div class="reset-view-hint">Ketuk 2x untuk reset layar</div>
                <canvas id="market-chart"></canvas>
            </div>
            
            <div class="control-panel">
                <div class="trade-settings">
                    <label><input type="checkbox" id="auto-rr" checked onchange="toggleManualInput()" style="accent-color: var(--maroon-main);"> Auto TP $20 / SL $10</label>
                    <div id="manual-inputs" class="manual-inputs">
                        <div class="input-group">
                            <label>TARGET PROFIT ($)</label>
                            <input type="number" id="input-tp" placeholder="Cth: 20">
                        </div>
                        <div class="input-group">
                            <label>BATAS RUGI / SL ($)</label>
                            <input type="number" id="input-sl" placeholder="Cth: 10">
                        </div>
                    </div>
                    <div style="margin-top:8px;">
                        <label style="font-size:0.65rem; color:var(--gold-accent);">CATATAN ENTRY:</label>
                        <textarea id="trade-notes" rows="2" placeholder="Alasan entry..."></textarea>
                    </div>
                </div>

                <div class="chart-controls">
                    <button class="chart-btn" id="btn-tf-1m" onclick="setTimeframe('1m')">1M</button>
                    <button class="chart-btn" id="btn-tf-5m" onclick="setTimeframe('5m')">5M</button>
                    <button class="chart-btn" id="btn-tf-15m" onclick="setTimeframe('15m')">15M</button>
                    <button class="chart-btn" id="btn-sma" onclick="toggleIndicator('sma')">SMA</button>

        function createConfetti() {
            const colors = ['#d4af37', '#ffd700', '#ff6b6b', '#4ecdc4', '#45b7d1', '#f9ca24'];
            for (let i = 0; i < 100; i++) {

        function createShockwave() {
            const cx = particleCanvas.width / 2;
            const cy = particleCanvas.height / 2;
            for (let i = 0; i < 50; i++) {
                const angle = (Math.PI * 2 / 50) * i;
                particles.push({
                    x: cx, y: cy,
                    vx: Math.cos(angle) * 8,
                    vy: Math.sin(angle) * 8,
                    color: '#ff0000',
                    size: 4,
                    life: 1,

        function animateParticles() {
            pCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1;
                p.life -= p.decay;
                pCtx.globalAlpha = p.life;

            if(e.touches.length === 2) {
                e.preventDefault(); 
                let currentDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                if (initialPinchDist > 0) {
                    if (currentDist - initialPinchDist > 15) { zoom(1); initialPinchDist = currentDist; } 
                    else if (initialPinchDist - currentDist > 15) { zoom(-1); initialPinchDist = currentDist; }
                }
            }
        }, {passive: false});

        function resizeCanvas() {
            width = canvas.parentElement.clientWidth; height = canvas.parentElement.clientHeight;
            canvas.width = width; canvas.height = height; drawChart();
        }

        /* --- MARGIN CALL --- */
        function checkMarginCall() {
            if (!position) return false;
            let currentPnL = calculatePnL();
            if (balance + currentPnL <= 0.05) { 
                triggerMarginCall(currentPnL);
                return true;
            }
            return false;
        }

        function triggerMarginCall(lossAmt) {
            balance = 0;
            document.getElementById('balance').innerText = '$0.00';
            addJournal(position, "MC", lossAmt);
            position = null; entryAbsoluteIndex = -1; consecutiveSL = 0; consecutiveTP = 0; consecutiveTPProfit = 0;
            document.getElementById('pnl').innerText = '$0.00'; 
            document.getElementById('pnl').className = 'info-value';
            document.getElementById('btn-buy').style.display = 'block'; 
            document.getElementById('btn-sell').style.display = 'block';
            document.getElementById('btn-close').style.display = 'none'; 
            document.querySelector('.trade-settings').style.display = 'block';
            playSound('mc');
            createShockwave();
            triggerRedFlash();
            updateResetButtons();
            document.getElementById('mc-screen').style.display = 'flex';
            drawChart();
        }

        function triggerRedFlash() {
            const container = document.getElementById('app-container');
            const flash = document.createElement('div');
            flash.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(255,0,0,0.4);z-index:1400;pointer-events:none;animation:flashFade 0.6s forwards;';
            container.appendChild(flash);
            setTimeout(() => flash.remove(), 600);
        }

        function updateResetButtons() {
            const btnFree = document.getElementById('btn-free-reset');
            const cooldownText = document.getElementById('reset-cooldown');
            if (canFreeReset()) {
                btnFree.style.display = 'block';
                cooldownText.textContent = 'âœ… Reset gratis tersedia!';
            } else {
                btnFree.style.display = 'none';
                cooldownText.textContent = getResetCooldownText();
            }
        }

        function resetAfterMC(paid) {
            if (paid) {
                balance = 100;
            } else {
                if (!canFreeReset()) {
                    alert('Reset gratis belum tersedia!');
                    return;
                }
                balance = 100;
                lastResetTime = Date.now();
                localStorage.setItem('lastFreeReset', lastResetTime.toString());
            }
            document.getElementById('mc-screen').style.display = 'none';
            document.getElementById('taunt-loss').classList.remove('show'); tauntShown = false;
            document.getElementById('balance').innerText = '$100.00';
            resetView();
            consecutiveSL = 0; consecutiveTP = 0; consecutiveTPProfit = 0;
        }

        function resetAfterMC(paid) {
            if (paid) {
                balance = Math.max(0, balance - 10); // Biaya $10
            } else {
                if (!canFreeReset()) {
                    alert('Reset gratis belum tersedia!');
                    return;
                }
                lastResetTime = Date.now();
                localStorage.setItem('lastFreeReset', lastResetTime.toString());
            }
            balance = 100;
            document.getElementById('mc-screen').style.display = 'none';
            document.getElementById('taunt-loss').classList.remove('show'); tauntShown = false;
            document.getElementById('balance').innerText = '$' + balance.toLocaleString('en-US', {minimumFractionDigits: 2});
            resetView();
            consecutiveSL = 0; consecutiveTP = 0; consecutiveTPProfit = 0;
        }

        function startGame() {
            document.getElementById('quiz-section').style.display = 'none'; document.getElementById('game-section').style.display = 'flex';
            loadStats();
            dailyChallenge = getDailyChallenge();
            showDailyChallenge();
            generateHistory(); window.addEventListener('resize', resizeCanvas); resizeCanvas();
            updateResetButtons();
            
            const tickMs = currentTimeframe === '1m' ? 100 : currentTimeframe === '5m' ? 500 : 1000;
            
            setInterval(() => {
                if(!isMarketPlaying) return;

                for(let s = 0; s < gameSpeed; s++) {
                    if(trendDuration <= 0) { trendDrift = (Math.random() - 0.5) * 2.5; trendDuration = Math.floor(Math.random() * 50) + 20; }
                    trendDuration--;

                    let fluctuation = (Math.random() - 0.5) * 4 + trendDrift;
                    currentPrice += fluctuation; ticks++;
                    let lastCandle = candles[candles.length - 1];

                    if (ticks >= 20) {
                        candles.push({ open: currentPrice, high: currentPrice, low: currentPrice, close: currentPrice });
                        if(candles.length > 1500) { candles.shift(); if(entryAbsoluteIndex > 0) entryAbsoluteIndex--; }
                        ticks = 0;
                    } else {
                        lastCandle.close = currentPrice;
                        lastCandle.high = Math.max(lastCandle.high, currentPrice);
                        lastCandle.low = Math.min(lastCandle.low, currentPrice);
                    }

                    if (position) { 
                        let isMC = checkMarginCall();
                        if(!isMC) { updatePnL(); checkSLTP(); }
                    }
                }
                requestAnimationFrame(drawChart);
            }, tickMs);
        }

        function drawChart() {
            ctx.clearRect(0, 0, width, height);

            let chartWidth = width - 65; 

            let windowStartIndex = candles.length - visibleCandlesCount - scrollOffset;
            let startIndex = Math.max(0, windowStartIndex);
            let endIndex = Math.min(candles.length, windowStartIndex + visibleCandlesCount);
            let visibleData = candles.slice(startIndex, endIndex);

            let baseMin, baseMax;
            if(visibleData.length > 0) {
                baseMin = Math.min(...visibleData.map(c => c.low)) - 10;
                baseMax = Math.max(...visibleData.map(c => c.high)) + 10;
            } else {
                baseMin = currentPrice - 10;
                baseMax = currentPrice + 10;
            }
            
            let midPrice = (baseMax + baseMin) / 2;
            let originalRange = baseMax - baseMin;
            let currentRange = originalRange / priceZoom;
            if(currentRange === 0) currentRange = 1;

            let minP = midPrice - (currentRange / 2) + priceOffset;
            let maxP = midPrice + (currentRange / 2) + priceOffset;

            const getY = p => height - ((p - minP) / currentRange) * height;
            
            let candleSpacing = chartWidth / visibleCandlesCount;
            let candleWidth = candleSpacing * 0.8;

            // DRAW INDICATORS
            if (showSMA || showEMA) {
                const smaPeriod = 20;
                const emaPeriod = 20;
                const multiplier = 2 / (emaPeriod + 1);
                
                if (showSMA) {
                    ctx.strokeStyle = '#ffa500';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    let started = false;
                    for (let i = smaPeriod - 1; i < candles.length; i++) {
                        let sum = 0;
                        for (let j = i - smaPeriod + 1; j <= i; j++) sum += candles[j].close;
                        let sma = sum / smaPeriod;
                        let screenIndex = i - windowStartIndex;
                        if (screenIndex >= 0 && screenIndex <= visibleCandlesCount) {
                            let x = screenIndex * candleSpacing + candleSpacing / 2;
                            let y = getY(sma);
                            if (!started) { ctx.moveTo(x, y); started = true; }
                            else ctx.lineTo(x, y);
                        }
                    }
                    ctx.stroke();
                }

                if (showEMA) {
                    ctx.strokeStyle = '#00bfff';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    let ema = candles[0].close;
                    let started = false;
                    for (let i = 0; i < candles.length; i++) {
                        ema = (candles[i].close - ema) * multiplier + ema;
                        let screenIndex = i - windowStartIndex;
                        if (screenIndex >= 0 && screenIndex <= visibleCandlesCount) {
                            let x = screenIndex * candleSpacing + candleSpacing / 2;
                            let y = getY(ema);
                            if (!started) { ctx.moveTo(x, y); started = true; }
                            else ctx.lineTo(x, y);
                        }
                    }
                    ctx.stroke();
                }
            }

            // GAMBAR KOTAK BUY / SELL
            if (position && entryAbsoluteIndex >= 0) {
                let screenIndex = entryAbsoluteIndex - windowStartIndex;
                let entryX = screenIndex * candleSpacing;
                let boxWidth = chartWidth - entryX;
                if(boxWidth > 0) {
                    let yTP = getY(tpPrice);
                    let ySL = getY(slPrice);
                    ctx.fillStyle = 'rgba(30, 130, 76, 0.2)'; 
                    ctx.fillRect(entryX, yTP, boxWidth, getY(entryPrice) - yTP); 
                    ctx.fillStyle = 'rgba(153, 31, 31, 0.2)'; 
                    ctx.fillRect(entryX, getY(entryPrice), boxWidth, ySL - getY(entryPrice)); 
                }
            }

            // CANDLESTICK - Solid fill
            visibleData.forEach((c, i) => {
                let virtualIndex = startIndex + i;
                let screenIndex = virtualIndex - windowStartIndex;
                let x = screenIndex * candleSpacing + candleSpacing / 2;
                let isBull = c.close >= c.open;
                let color = isBull ? '#1e824c' : '#991f1f'; 
                ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.moveTo(x, getY(c.high)); ctx.lineTo(x, getY(c.low)); ctx.stroke();
                let bodyTop = getY(Math.max(c.open, c.close));
                let bodyBottom = getY(Math.min(c.open, c.close));
                let bodyHeight = Math.max(2, bodyBottom - bodyTop);
                ctx.fillRect(x - candleWidth/2, bodyTop, candleWidth, bodyHeight);
            });

            // GARIS TARGET & ENTRY
            if (position) {
                drawLine(getY(entryPrice), '#d4af37', `ENTRY`, chartWidth);
                drawLine(getY(tpPrice), '#1e824c', 'TP', chartWidth);
                drawLine(getY(slPrice), '#991f1f', 'SL', chartWidth);
            }
            if (Math.abs(priceOffset) < currentRange * 2) {
                drawLine(getY(currentPrice), '#f0e6e6', currentPrice.toFixed(1), chartWidth, true);
            }

            // BLOK BACKGROUND SKALA HARGA
            ctx.fillStyle = '#000';
            ctx.fillRect(chartWidth, 0, width - chartWidth, height);
            ctx.strokeStyle = '#333'; ctx.beginPath(); ctx.moveTo(chartWidth, 0); ctx.lineTo(chartWidth, height); ctx.stroke();

            // ANGKA SKALA HARGA - Lebih jelas dan lengkap
            let priceSteps = 8;
            ctx.fillStyle = '#aaa'; ctx.font = '10px Poppins'; ctx.textAlign = 'left';
            for(let i=0; i<=priceSteps; i++) {
                let y = height * (i/priceSteps);
                let priceAtGrid = maxP - (currentRange * (i/priceSteps));
                ctx.fillText(priceAtGrid.toFixed(2), chartWidth + 6, y + 4);
                // Grid line tipis
                ctx.strokeStyle = '#1a1a1a'; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(chartWidth, y); ctx.stroke();
            }
        }

        function drawLine(y, color, text, chartWidth, isCurrent = false) {
            if(y < 0 || y > height) return; 
            ctx.strokeStyle = color; ctx.lineWidth = 1;
            if(!isCurrent) ctx.setLineDash([4, 4]); 
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(chartWidth, y); ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = isCurrent ? color : 'rgba(13,6,6,0.8)';
            ctx.fillRect(chartWidth - 45, y - 9, 45, 18);
            ctx.fillStyle = isCurrent ? '#000' : color;
            ctx.font = '8px Poppins'; ctx.textAlign = 'right';
            ctx.fillText(text, chartWidth - 3, y + 3);
        }

        /* --- Trading Logic & Journal --- */
        function addJournal(type, result, pnlVal) {
            document.querySelector('.journal-empty')?.remove();
            let journalDiv = document.getElementById('journal-list');
            let item = document.createElement('div');
            item.className = 'journal-item';
            let colorClass = pnlVal >= 0 ? 'profit' : 'loss';
            let sign = pnlVal >= 0 ? '+' : '';
            const note = document.getElementById('trade-notes').value;
            const noteText = note ? ` [${note.substring(0, 20)}${note.length > 20 ? '...' : ''}]` : '';
            item.innerHTML = `<span>${type} (${result})${noteText}</span> <span class="${colorClass}">${sign}$${Math.abs(pnlVal).toFixed(2)}</span>`;
            journalDiv.prepend(item);
        }

        function updateStreakDisplay() {
            const el = document.getElementById('streak-display');
            if (consecutiveTP >= 2) {
                el.innerHTML = `ðŸ”¥ ${consecutiveTP}x TP Streak`;
                el.style.display = 'block';
                el.style.borderColor = 'var(--buy-color)';
                el.style.color = 'var(--buy-color)';
            } else if (consecutiveSL >= 2) {
                el.innerHTML = `â„ï¸ ${consecutiveSL}x SL Streak`;
                el.style.display = 'block';
                el.style.borderColor = 'var(--sell-color)';
                el.style.color = 'var(--sell-color)';
            } else {
                el.style.display = 'none';
            }
        }

        function openPosition(type) {
            if (position) return;
            playSound('click');
            
            let isAuto = document.getElementById('auto-rr').checked;
            entryPrice = currentPrice;
            entryAbsoluteIndex = candles.length - 1; 
            resetView(); 
            tauntShown = false; document.getElementById('taunt-loss').classList.remove('show');

            let tpDollar = isAuto ? 20 : parseFloat(document.getElementById('input-tp').value);
            let slDollar = isAuto ? 10 : parseFloat(document.getElementById('input-sl').value);

            if (isNaN(tpDollar) || isNaN(slDollar) || tpDollar <= 0 || slDollar <= 0) { 
                alert("âš ï¸ Masukkan angka Dollar TP/SL yg benar!"); return; 
            }

            if(type === 'BUY') { tpPrice = entryPrice + tpDollar; slPrice = entryPrice - slDollar; } 
            else { tpPrice = entryPrice - tpDollar; slPrice = entryPrice + slDollar; }

            position = type;
            document.getElementById('btn-buy').style.display = 'none'; document.getElementById('btn-sell').style.display = 'none';
            document.getElementById('btn-close').style.display = 'block';
            document.querySelector('.trade-settings').style.display = 'none';
            drawChart();
        }

        function checkSLTP() {
            if (!position) return;
            if (position === 'BUY') {
                if (currentPrice >= tpPrice) closePosition(false, 'Hit TP', 'TP');
                else if (currentPrice <= slPrice) closePosition(false, 'Hit SL', 'SL');
            } else {
                if (currentPrice <= tpPrice) closePosition(false, 'Hit TP', 'TP');
                else if (currentPrice >= slPrice) closePosition(false, 'Hit SL', 'SL');
            }
        }

        function closePosition(manual = false, msg = 'Ditutup', reason = 'MANUAL') {
            if (!position) return;
            let pnl = calculatePnL(); 
            balance += pnl;
            document.getElementById('balance').innerText = '$' + balance.toLocaleString('en-US', {minimumFractionDigits: 2});
            
            addJournal(position, reason, pnl);
            updateStats(pnl, reason);
            updateDailyChallenge(pnl);
            document.getElementById('taunt-loss').classList.remove('show'); tauntShown = false;

            if (reason === 'TP' || (manual && pnl > 0)) { 
                consecutiveSL = 0; 
                consecutiveTP++;
                consecutiveTPProfit += pnl;
                if(consecutiveTP > stats.consecutiveTPMax) { stats.consecutiveTPMax = consecutiveTP; saveStats(); }
                playSound('tp');
                triggerParticles('confetti');
            } 
            else if (reason === 'SL' || (manual && pnl < 0)) { 
                consecutiveSL++; 
                consecutiveTP = 0;
                consecutiveTPProfit = 0;
                if(consecutiveSL > stats.consecutiveSLMax) { stats.consecutiveSLMax = consecutiveSL; saveStats(); }
                playSound('sl');
                createRedFlash();
            } 

            if(consecutiveTP >= 3 && consecutiveTPProfit > 50) {
                document.getElementById('pro-screen').style.display = 'flex';
                playSound('win');
                triggerParticles('confetti');
                consecutiveTP = 0;
                consecutiveTPProfit = 0;
            }

            if (balance >= 130 && !canExit) { 
                document.getElementById('winner-screen').style.display = 'flex'; 
                playSound('win');
                triggerParticles('confetti');
            }
            else if (consecutiveSL >= 3) { 
                document.getElementById('loser-screen').style.display = 'flex'; 
                consecutiveSL = 0; 
            }
            else if (balance > 0 && balance < 20) { 
                document.getElementById('low-balance-screen').style.display = 'flex'; 
            }

            position = null; entryAbsoluteIndex = -1;
            document.getElementById('pnl').innerText = '$0.00'; document.getElementById('pnl').className = 'info-value';
            document.getElementById('btn-buy').style.display = 'block'; document.getElementById('btn-sell').style.display = 'block';
            document.getElementById('btn-close').style.display = 'none'; document.querySelector('.trade-settings').style.display = 'block';
            document.getElementById('trade-notes').value = '';
            updateStreakDisplay();
            drawChart();
        }

        function calculatePnL() { return position ? (position === 'BUY' ? currentPrice - entryPrice : entryPrice - currentPrice) : 0; }
        
        function updatePnL() {
            if (!position) return;
            let pnl = calculatePnL(); let el = document.getElementById('pnl');
            el.innerText = (pnl >= 0 ? '+$' : '-$') + Math.abs(pnl).toFixed(2);
            el.className = pnl >= 0 ? 'info-value profit' : 'info-value loss';

            if (pnl <= -50 && !tauntShown) {
                document.getElementById('taunt-loss').classList.add('show');
                tauntShown = true;
            } else if (pnl > -50 && tauntShown) {
                document.getElementById('taunt-loss').classList.remove('show');
                tauntShown = false;
            }
        }
    </script>
