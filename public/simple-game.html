<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Trading Simulator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; color: #f0e6e6; font-family: 'Poppins', sans-serif;
            height: 100vh; overflow: hidden; user-select: none;
        }
        #app {
            width: 100%; height: 100%; max-width: 450px; margin: 0 auto;
            background: #050505; display: flex; flex-direction: column;
        }
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px; background: #0d0606; border-bottom: 1px solid #400707;
        }
        .balance { font-size: 0.9rem; color: #d4af37; font-weight: 600; }
        .pnl { font-size: 0.9rem; }
        .profit { color: #1e824c; }
        .loss { color: #991f1f; }
        #chart-container { flex: 1; position: relative; background: #000; }
        canvas { width: 100%; height: 100%; display: block; }
        .controls {
            padding: 10px; background: #0d0606; border-top: 1px solid #400707;
            display: flex; flex-direction: column; gap: 8px;
        }
        .btn-group { display: flex; gap: 8px; }
        .btn {
            flex: 1; padding: 12px; border: none; border-radius: 6px;
            font-weight: 600; color: white; cursor: pointer; font-size: 0.9rem;
        }
        .btn-buy { background: #1e824c; }
        .btn-sell { background: #991f1f; }
        .btn-close { background: transparent; border: 1px solid #d4af37; color: #d4af37; }
        .settings {
            background: #150a0a; padding: 8px; border-radius: 6px;
            border: 1px solid #400707; font-size: 0.75rem;
        }
        .journal {
            background: #110808; border: 1px solid #400707; border-radius: 6px;
            padding: 6px; max-height: 80px; overflow-y: auto; font-size: 0.7rem;
        }
        .journal-item { padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 1000; flex-direction: column;
            justify-content: center; align-items: center; padding: 20px; text-align: center;
        }
        .overlay.active { display: flex; }
        .overlay h2 { font-size: 2rem; margin-bottom: 15px; }
        .overlay button {
            padding: 10px 25px; background: transparent; border: 2px solid white;
            color: white; border-radius: 6px; cursor: pointer; margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="top-bar">
            <div>
                <div class="balance">Balance: $<span id="balance">100.00</span></div>
                <div class="pnl">PnL: $<span id="pnl">0.00</span></div>
            </div>
            <button class="btn" style="width:auto; padding:5px 10px; background:#731313;" onclick="togglePause()" id="pause-btn">PAUSE</button>
        </div>
        
        <div id="chart-container">
            <canvas id="chart"></canvas>
            
            <div id="mc-overlay" class="overlay">
                <h2 style="color:#ff0000;">MARGIN CALL</h2>
                <p>Saldo Habis!</p>
                <button onclick="resetGame()">RESET $100</button>
            </div>
            
            <div id="win-overlay" class="overlay">
                <h2 style="color:#d4af37;">TARGET TERCAPAI!</h2>
                <p>Profit +$30!</p>
                <button onclick="alert('Selesai')">TUTUP</button>
            </div>
        </div>
        
        <div class="controls">
            <div class="settings">
                <label><input type="checkbox" id="auto-rr" checked> Auto TP $20 / SL $10</label>
                <div id="manual" style="display:none; margin-top:8px;">
                    <input type="number" id="tp" placeholder="TP $">
                    <input type="number" id="sl" placeholder="SL $">
                </div>
            </div>
            
            <div class="btn-group">
                <button class="btn btn-buy" onclick="openPosition('BUY')">BUY</button>
                <button class="btn btn-sell" onclick="openPosition('SELL')">SELL</button>
                <button class="btn btn-close" id="close-btn" onclick="closePosition()" style="display:none;">TUTUP</button>
            </div>
            
            <div class="journal" id="journal">
                <div style="color:#555; text-align:center; font-style:italic;">Belum ada trade</div>
            </div>
        </div>
    </div>

    <script>
        // Game state
        let balance = 100;
        let position = null;
        let entryPrice = 0;
        let tpPrice = 0;
        let slPrice = 0;
        let isPaused = false;
        let candles = [];
        let currentPrice = 2050;
        
        // Canvas setup
        const canvas = document.getElementById('chart');
        const ctx = canvas.getContext('2d');
        
        function resize() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            draw();
        }
        
        // Generate candles
        function generateCandles() {
            candles = [];
            let price = currentPrice;
            for (let i = 0; i < 100; i++) {
                let open = price;
                let close = price + (Math.random() - 0.5) * 8;
                let high = Math.max(open, close) + Math.random() * 4;
                let low = Math.min(open, close) - Math.random() * 4;
                candles.push({ open, high, low, close });
                price = close;
            }
            currentPrice = price;
        }
        
        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            if (candles.length === 0) return;
            
            const w = canvas.width / candles.length;
            const candleW = w * 0.8;
            
            // Price scale
            const prices = candles.flatMap(c => [c.high, c.low]);
            const min = Math.min(...prices) - 10;
            const max = Math.max(...prices) + 10;
            const range = max - min;
            
            candles.forEach((c, i) => {
                const x = i * w + w / 2;
                const isBull = c.close >= c.open;
                const color = isBull ? '#1e824c' : '#991f1f';
                
                // Wick
                ctx.strokeStyle = color;
                ctx.beginPath();
                ctx.moveTo(x, ((max - c.high) / range) * canvas.height);
                ctx.lineTo(x, ((max - c.low) / range) * canvas.height);
                ctx.stroke();
                
                // Body
                const bodyTop = ((max - Math.max(c.open, c.close)) / range) * canvas.height;
                const bodyBottom = ((max - Math.min(c.open, c.close)) / range) * canvas.height;
                ctx.fillStyle = color;
                ctx.fillRect(x - candleW/2, bodyTop, candleW, bodyBottom - bodyTop);
            });
            
            // Entry/Tp/Sl lines
            if (position) {
                const ey = ((max - entryPrice) / range) * canvas.height;
                const ty = ((max - tpPrice) / range) * canvas.height;
                const sy = ((max - slPrice) / range) * canvas.height;
                
                ctx.strokeStyle = '#d4af37'; ctx.setLineDash([4,4]);
                ctx.beginPath(); ctx.moveTo(0, ey); ctx.lineTo(canvas.width, ey); ctx.stroke();
                ctx.strokeStyle = '#1e824c';
                ctx.beginPath(); ctx.moveTo(0, ty); ctx.lineTo(canvas.width, ty); ctx.stroke();
                ctx.strokeStyle = '#991f1f';
                ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(canvas.width, sy); ctx.stroke();
                ctx.setLineDash([]);
            }
        }
        
        // Game loop
        function update() {
            if (isPaused) return;
            
            // Add new candle
            const last = candles[candles.length - 1];
            const open = last ? last.close : currentPrice;
            const close = open + (Math.random() - 0.5) * 4;
            const high = Math.max(open, close) + Math.random() * 2;
            const low = Math.min(open, close) - Math.random() * 2;
            candles.push({ open, high, low, close });
            currentPrice = close;
            
            if (candles.length > 200) candles.shift();
            
            // Check TP/SL
            if (position) {
                const pnl = position === 'BUY' ? currentPrice - entryPrice : entryPrice - currentPrice;
                document.getElementById('pnl').textContent = pnl.toFixed(2);
                document.getElementById('pnl').className = 'pnl ' + (pnl >= 0 ? 'profit' : 'loss');
                
                if (currentPrice >= tpPrice || currentPrice <= slPrice) {
                    closePosition();
                }
            }
            
            draw();
        }
        
        function openPosition(type) {
            if (position) return;
            position = type;
            entryPrice = currentPrice;
            const tp = 20, sl = 10;
            tpPrice = type === 'BUY' ? entryPrice + tp : entryPrice - tp;
            slPrice = type === 'BUY' ? entryPrice - sl : entryPrice + sl;
            
            document.getElementById('close-btn').style.display = 'block';
            document.querySelector('.btn-group').children[0].style.display = 'none';
            document.querySelector('.btn-group').children[1].style.display = 'none';
        }
        
        function closePosition() {
            if (!position) return;
            const pnl = position === 'BUY' ? currentPrice - entryPrice : entryPrice - currentPrice;
            balance += pnl;
            
            // Journal
            const journal = document.getElementById('journal');
            if (journal.querySelector('.journal-item')) {
                const item = document.createElement('div');
                item.className = 'journal-item';
                item.innerHTML = `${position} @ ${entryPrice.toFixed(2)} | PnL: $${pnl.toFixed(2)}`;
                journal.insertBefore(item, journal.firstChild);
            } else {
                journal.innerHTML = `<div class="journal-item">${position} @ ${entryPrice.toFixed(2)} | PnL: $${pnl.toFixed(2)}</div>`;
            }
            
            // Check win/lose
            if (balance >= 130) {
                document.getElementById('win-overlay').classList.add('active');
            }
            
            position = null;
            document.getElementById('balance').textContent = balance.toFixed(2);
            document.getElementById('pnl').textContent = '0.00';
            document.getElementById('pnl').className = 'pnl';
            document.getElementById('close-btn').style.display = 'none';
            document.querySelector('.btn-group').children[0].style.display = 'block';
            document.querySelector('.btn-group').children[1].style.display = 'block';
        }
        
        function resetGame() {
            balance = 100;
            position = null;
            document.getElementById('balance').textContent = '100.00';
            document.getElementById('pnl').textContent = '0.00';
            document.getElementById('mc-overlay').classList.remove('active');
            document.getElementById('close-btn').style.display = 'none';
            document.querySelector('.btn-group').children[0].style.display = 'block';
            document.querySelector('.btn-group').children[1].style.display = 'block';
            generateCandles();
            draw();
        }
        
        function togglePause() {
            isPaused = !isPaused;
            document.getElementById('pause-btn').textContent = isPaused ? 'PLAY' : 'PAUSE';
        }
        
        // Auto TP/SL toggle
        document.getElementById('auto-rr').addEventListener('change', function() {
            document.getElementById('manual').style.display = this.checked ? 'none' : 'block';
        });
        
        // Init
        generateCandles();
        resize();
        setInterval(update, 100);
        window.addEventListener('resize', resize);
        
        console.log('Game initialized');
    </script>
</body>
</html>
