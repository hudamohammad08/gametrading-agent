<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Trading Simulator - Minimal Test</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #test { font-size: 1.5rem; text-align: center; padding: 20px; }
        canvas { display: block; margin: 20px auto; background: #111; border: 1px solid #333; }
    </style>
</head>
<body>
    <div id="test">
        <h1>VIP Trading Simulator</h1>
        <p>Jika kamu melihat ini, HTML berfungsi normal.</p>
        <canvas id="chart" width="300" height="200"></canvas>
        <p style="color:#aaa; font-size:0.9rem;">Chart area di atas harus berwarna gelap dengan kotak hijau.</p>
    </div>
    <script>
        const canvas = document.getElementById('chart');
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#1e824c';
        ctx.fillRect(50, 50, 200, 100);
        console.log('Minimal test rendered');
    </script>
</body>
</html>
